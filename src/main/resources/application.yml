server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: true
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
    max-threads: 20
    min-spare-threads: 2
    max-connections: 1000

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        # 메모리 최적화
        cache:
          use_second_level_cache: false
          use_query_cache: false
        hbm2ddl:
          import_files_sql_extractor: org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 5000
          connection-timeout: 5000
          write-timeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${APP_BACKEND_URL}/login/oauth2/code/google
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  # 추가 최적화 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false

  web:
    resources:
      add-mappings: false  # 정적 리소스 비활성화

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-southeast-2
    s3:
      bucket: artive-uploads

app:
  frontend-url: ${APP_FRONTEND_URL}
  backend-url: ${APP_BACKEND_URL}

# 로깅 최적화
logging:
  level:
    root: WARN
    org.hibernate: ERROR
    org.springframework: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    com.zaxxer.hikari: ERROR
    com.artive: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JVM 및 성능 튜닝
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
  health:
    defaults:
      enabled: false